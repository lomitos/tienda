<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lomitos Santiagueños — Sándwiches, Hamburguesas y Papas</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1E1E1E;
      --bg-card-hover: #262626;
      --brand-green: #38C695;
      --brand-green-hover: #2DA77D;
      --text-white: #FFFFFF;
      --text-gray: #A0A0A0;
      --border-color: #2A2A2A;
      --font-title: 'Teko', sans-serif;
      --font-body: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background-color: #0A0A0A;
      border-bottom: 2px solid var(--brand-green);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.8rem 1.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      background: #1A1A1A;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: white;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--brand-green);
    }

    .search-box i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
    }

    .cart-header-btn {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--brand-green);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-badge {
      background: var(--brand-green);
      color: #000;
      border-radius: 50%;
      padding: 0.1rem 0.5rem;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* HERO BANNER CON LOGO GIGANTE CIRCULAR */
    .hero {
      background-color: #050505;
      padding: 3.5rem 1rem 2.5rem;
      text-align: center;
      border-bottom: 2px solid var(--brand-green);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }

    .hero-logo {
      width: 320px;
      height: 320px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid var(--brand-green);
      box-shadow: 0 0 45px rgba(56, 198, 149, 0.45);
      transition: transform 0.3s ease;
    }

    .hero-logo:hover {
      transform: scale(1.03);
    }

    .store-status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1.3rem;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      background: #1A1A1A;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .status-open { background-color: #25D366; box-shadow: 0 0 10px #25D366; }

    /* NAVEGACIÓN DE CATEGORÍAS */
    .categories-nav {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      padding: 1.2rem;
      background: #0D0D0D;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.3rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--brand-green);
      border-color: var(--brand-green);
      color: #000;
      font-weight: bold;
    }

    /* CATÁLOGO */
    .catalog-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .category-title {
      font-family: var(--font-title);
      font-size: 2.5rem;
      letter-spacing: 1px;
      border-left: 5px solid var(--brand-green);
      padding-left: 1rem;
      margin: 2rem 0 1rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--brand-green);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--brand-green);
      background: var(--bg-card-hover);
    }

    .product-info h3 {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 0.4rem;
      color: var(--text-white);
    }

    .product-desc {
      font-size: 0.88rem;
      color: var(--text-gray);
      margin-bottom: 1rem;
      min-height: 2.8rem;
    }

    .product-price {
      color: var(--brand-green);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .quantity-controls button {
      background: transparent;
      color: white;
      border: none;
      width: 32px;
      height: 36px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .quantity-controls span {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .btn-add {
      flex: 1;
      background: var(--brand-green);
      color: #000;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--brand-green-hover);
    }

    /* CARRITO FLOTANTE Y SIDEBAR */
    .cart-float-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0A0A0A;
      border: 2px solid var(--brand-green);
      border-radius: 15px;
      padding: 0.8rem 1.2rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      gap: 1.2rem;
      z-index: 99;
    }

    .btn-open-cart {
      background: var(--brand-green);
      color: #000;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 200;
    }

    .cart-sidebar {
      position: fixed;
      top: 0; right: -400px; width: 100%; max-width: 380px; height: 100%;
      background: #161616;
      border-left: 2px solid var(--brand-green);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }

    .cart-sidebar.open { right: 0; }

    .cart-sidebar-header {
      padding: 1.2rem;
      background: #0A0A0A;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-sidebar-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-sidebar-footer {
      padding: 1.2rem;
      background: #0A0A0A;
      border-top: 1px solid var(--border-color);
    }

    .btn-checkout-wa {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
    }

    /* MODAL */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--brand-green);
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; color: var(--text-gray); font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.7rem;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      outline: none;
    }

    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .btn-cancel { flex: 1; background: #333; color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; }
    .btn-send { flex: 2; background: #25D366; color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; }

    footer {
      background: #050505;
      border-top: 1px solid var(--border-color);
      padding: 2rem;
      text-align: center;
      margin-top: 4rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .hero-logo {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>

  <!-- HEADER -->
  <header>
    <div class="header-actions">
      <div class="search-box">

        <input type="text" id="searchInput" placeholder="Buscar plato o bebida..." onkeyup="filterProducts()">
      </div>
      <button class="cart-header-btn" onclick="openCartSidebar()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="headerCartCount">0</span>
      </button>
    </div>
  </header>

  <!-- HERO BANNER CON LOGO GIGANTE -->
  <section class="hero">
    <img src="logo.png" alt="Lomitos Santiagueños Logo" class="hero-logo" onerror="this.src='https://via.placeholder.com/320/121212/38C695?text=Lomitos+Santiagueños'">
    <div class="store-status">
      <span class="status-dot status-open"></span>
      <span>Abierto hoy de 20:00 a 23:59 hs</span>
    </div>
  </section>

  <!-- NAVEGACIÓN DE CATEGORÍAS -->
  <nav class="categories-nav">
    <button class="cat-btn active" onclick="filterCategory('all', event)"><i class="fa-solid fa-border-all"></i> Todos</button>
    <button class="cat-btn" onclick="filterCategory('promos', event)"><i class="fa-solid fa-fire"></i> Promos</button>
    <button class="cat-btn" onclick="filterCategory('lomitos', event)"><i class="fa-solid fa-bread-slice"></i> Lomitos</button>
    <button class="cat-btn" onclick="filterCategory('milanesa', event)"><i class="fa-solid fa-utensils"></i> Sándwiches de Milanesa</button>
    <button class="cat-btn" onclick="filterCategory('hamburguesas', event)"><i class="fa-solid fa-burger"></i> Hamburguesas</button>
    <button class="cat-btn" onclick="filterCategory('papas', event)"><i class="fa-solid fa-bowl-food"></i> Papas para compartir</button>
    <button class="cat-btn" onclick="filterCategory('bebidas', event)"><i class="fa-solid fa-bottle-water"></i> Bebidas</button>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="catalog-container" id="catalog"></main>

  <!-- BARRA FLOTANTE -->
  <div class="cart-float-bar" id="cartBar" style="display: none;">
    <div>
      <div id="cartCount" style="font-size: 0.85rem; color: var(--text-gray);">0 productos</div>
      <div id="cartTotal" style="font-size: 1.1rem; font-weight: bold; color: var(--brand-green);">$0</div>
    </div>
    <button class="btn-open-cart" onclick="openCartSidebar()"><i class="fa-solid fa-cart-shopping"></i> Ver Pedido</button>
  </div>

  <!-- SIDEBAR CARRITO -->
  <div class="cart-sidebar-backdrop" id="cartBackdrop" onclick="closeCartSidebar()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-sidebar-header">
      <h2>MI PEDIDO</h2>
      <button style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;" onclick="closeCartSidebar()">&times;</button>
    </div>
    <div class="cart-sidebar-items" id="cartSidebarItems"></div>
    <div class="cart-sidebar-footer">
      <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; margin-bottom:1rem;">
        <span>TOTAL:</span>
        <span id="sidebarTotal" style="color:var(--brand-green);">$0</span>
      </div>
      <button class="btn-checkout-wa" onclick="openOrderModal()"><i class="fa-brands fa-whatsapp"></i> Enviar Pedido por WhatsApp</button>
    </div>
  </div>

  <!-- MODAL PEDIDO -->
  <div class="modal-backdrop" id="orderModal">
    <div class="modal-content">
      <h2 style="font-family: var(--font-title); font-size: 2rem; color: var(--brand-green);">DATOS PARA EL PEDIDO</h2>
      <div class="form-group">
        <label>Nombre y Apellido</label>
        <input type="text" id="custName" placeholder="Ej: Juan Pérez">
      </div>
      <div class="form-group">
        <label>Modalidad</label>
        <select id="custDelivery">
          <option value="Delivery / Envío a domicilio">Delivery / Envío a domicilio</option>
          <option value="Retiro en local">Retiro por el local</option>
        </select>
      </div>
      <div class="form-group">
        <label>Dirección (si es delivery)</label>
        <input type="text" id="custAddress" placeholder="Ej: Calle Balcarce 1234">
      </div>
      <div class="form-group">
        <label>Aclaraciones / Observaciones</label>
        <textarea id="custNotes" rows="2" placeholder="Ej: Sin mayonesa en la hamburguesa."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeOrderModal()">Volver</button>
        <button class="btn-send" onclick="sendWhatsAppOrder()"><i class="fa-brands fa-whatsapp"></i> Enviar a WhatsApp</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 <strong>Lomitos Santiagueños</strong>. Abierto todos los días de 20:00 a 23:59 hs.</p>
  </footer>

    let cart = {};
    let currentCategory = 'all';

    function renderCatalog() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = '';

      const categories = [
        { id: 'promos', title: '🔥 Promos' },
        { id: 'lomitos', title: '🥖 Lomitos' },
        { id: 'milanesa', title: '🥩 Sándwiches de Milanesa' },
        { id: 'hamburguesas', title: '🍔 Hamburguesas' },
        { id: 'papas', title: '🍟 Papas para compartir' },
        { id: 'bebidas', title: '🥤 Bebidas' }
      ];

      categories.forEach(cat => {
        if (currentCategory !== 'all' && currentCategory !== cat.id) return;

        const filteredProds = productsData.filter(p => p.category === cat.id);

        if (filteredProds.length > 0) {
          const catHeader = document.createElement('h2');
          catHeader.className = 'category-title';
          catHeader.innerText = cat.title;
          catalogEl.appendChild(catHeader);

          const grid = document.createElement('div');
          grid.className = 'products-grid';

          filteredProds.forEach(prod => {
            const qty = cart[prod.id] || 0;
            const card = document.createElement('div');
            card.className = 'product-card';

            card.innerHTML = `
              <div class="product-info">
                <h3>${prod.name}</h3>
                <div class="product-desc">${prod.desc}</div>
                <div class="product-price">$${prod.price.toLocaleString('es-AR')}</div>
              </div>
              <div class="card-actions">
                <div class="quantity-controls">
                  <button onclick="changeQty(${prod.id}, -1)">-</button>
                  <span id="qty-${prod.id}">${qty}</span>
                  <button onclick="changeQty(${prod.id}, 1)">+</button>
                </div>
                <button class="btn-add" onclick="changeQty(${prod.id}, 1)">
                  ${qty > 0 ? 'Añadido' : 'Agregar'}
                </button>
              </div>
            `;
            grid.appendChild(card);
          });

          catalogEl.appendChild(grid);
        }
      });
    }

    function changeQty(productId, change) {
      const currentQty = cart[productId] || 0;
      const newQty = Math.max(0, currentQty + change);

      if (newQty === 0) {
        delete cart[productId];
      } else {
        cart[productId] = newQty;
      }

      const qtySpan = document.getElementById(`qty-${productId}`);
      if (qtySpan) qtySpan.innerText = newQty;

      updateCartUI();
    }

    function updateCartUI() {
      let totalItems = 0;
      let totalPrice = 0;
      const cartItemsContainer = document.getElementById('cartSidebarItems');
      cartItemsContainer.innerHTML = '';

      for (const [id, qty] of Object.entries(cart)) {
        const prod = productsData.find(p => p.id == id);
        if (prod) {
          totalItems += qty;
          const subtotal = prod.price * qty;
          totalPrice += subtotal;

          const cartItem = document.createElement('div');
          cartItem.className = 'cart-item';
          cartItem.innerHTML = `
            <div class="cart-item-details">
              <div style="font-weight:bold; font-size:0.95rem;">${prod.name}</div>
              <div style="color:var(--brand-green); font-size:0.9rem;">$${prod.price.toLocaleString('es-AR')} x ${qty}</div>
            </div>
            <div class="quantity-controls">
              <button onclick="changeQty(${prod.id}, -1)">-</button>
              <span>${qty}</span>
              <button onclick="changeQty(${prod.id}, 1)">+</button>
            </div>
          `;
          cartItemsContainer.appendChild(cartItem);
        }
      }

      document.getElementById('headerCartCount').innerText = totalItems;
      document.getElementById('cartCount').innerText = `${totalItems} producto${totalItems > 1 ? 's' : ''}`;
      document.getElementById('cartTotal').innerText = `$${totalPrice.toLocaleString('es-AR')}`;
      document.getElementById('sidebarTotal').innerText = `$${totalPrice.toLocaleString('es-AR')}`;

      const cartBar = document.getElementById('cartBar');
      if (totalItems > 0) {
        cartBar.style.display = 'flex';
      } else {
        cartBar.style.display = 'none';
        closeCartSidebar();
      }
    }

    function openCartSidebar() {
      if (Object.keys(cart).length === 0) {
        alert("Tu carrito está vacío. Seleccioná algún producto para continuar.");
        return;
      }
      document.getElementById('cartSidebar').classList.add('open');
      document.getElementById('cartBackdrop').style.display = 'block';
    }

    function closeCartSidebar() {
      document.getElementById('cartSidebar').classList.remove('open');
      document.getElementById('cartBackdrop').style.display = 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }
      renderCatalog();
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');

      cards.forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        const desc = card.querySelector('.product-desc').innerText.toLowerCase();
        if (title.includes(query) || desc.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openOrderModal() {
      if (Object.keys(cart).length === 0) return;
      closeCartSidebar();
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    /* FORMATO OPCIÓN A */
    function sendWhatsAppOrder() {
      const name = document.getElementById('custName').value.trim();
      const delivery = document.getElementById('custDelivery').value;
      const address = document.getElementById('custAddress').value.trim();
      const notes = document.getElementById('custNotes').value.trim();

      if (!name) {
        alert("Por favor decinos tu nombre para el pedido.");
        return;
      }

      let orderDetails = "";
      let totalPrice = 0;

      for (const [id, qty] of Object.entries(cart)) {
        const prod = productsData.find(p => p.id == id);
        if (prod) {
          const itemTotal = prod.price * qty;
          totalPrice += itemTotal;
          orderDetails += `• ${qty}x ${prod.name} — $${itemTotal.toLocaleString('es-AR')}\n`;
        }
      }

      let message = `¡Hola *Lomitos Santiagueños*! 🥖🔥\nQuisiera realizar el siguiente pedido desde la web:\n\n`;
      message += `🛒 *DETALLE DEL PEDIDO:*\n${orderDetails}\n`;
      message += `💰 *TOTAL ESTIMADO:* $${totalPrice.toLocaleString('es-AR')}\n\n`;
      message += `👤 *DATOS PARA EL PEDIDO:*\n`;
      message += `• *Nombre:* ${name}\n`;
      message += `• *Modalidad:* ${delivery}\n`;
      if (address) message += `• *Dirección:* ${address}\n`;
      if (notes) message += `• *Aclaraciones:* ${notes}\n`;
      message += `\n¡Quedo a la espera de la confirmación! Muchas gracias.`;

      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

      window.open(whatsappUrl, '_blank');
      closeOrderModal();
    }

    renderCatalog();
  </script>
